<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }
        .header {
            text-align: center;
            color: #ff8c00;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 16px;
        }
        .result {
            margin: 8px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 3px solid #ff8c00;
        }
        .refresh-btn {
            width: 100%;
            padding: 10px;
            background: #ff8c00;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .refresh-btn:hover {
            background: #e67e00;
        }
        .refresh-btn:active {
            transform: translateY(1px);
        }
        .error {
            color: #dc3545;
            background: #f8d7da;
            border-color: #dc3545;
        }
    </style>
</head>
<body>
<div class="header">🎯 Gaijin Purchase Summary</div>
<div id="results">
    <div class="result">Загрузка данных 🔄</div>
</div>
<button class="refresh-btn" id="refresh">🔄 Обновить данные</button>

<script src="popup.js"></script>
</body>
</html>
