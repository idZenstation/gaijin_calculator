<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Gaijin Purchase Calculator</title>
    <style>
        body {
          width: 400px;
          padding: 15px;
          font-family: 'Segoe UI', Arial, sans-serif;
        }
        button {
          background: #4CAF50;
          color: white;
          border: none;
          padding: 10px;
          width: 100%;
          cursor: pointer;
          margin: 10px 0;
        }
        .loading, .error {
          padding: 10px;
          margin: 10px 0;
        }
        .error {
          background: #ffebee;
          color: #d32f2f;
        }
        .purchases-list li {
          margin: 8px 0;
          padding: 8px;
          border-bottom: 1px solid #eee;
          display: grid;
          grid-template-columns: 100px 1fr 80px;
        }
        .date {
          color: #666;
          font-size: 0.9em;
        }
        .price {
          text-align: right;
          font-weight: bold;
        }
        .recipient {
          grid-column: 2 / 4;
          font-size: 0.8em;
          color: #2196F3;
        }
    </style>
</head>
<body>
<h2>Gaijin Store Calculator</h2>
<button id="calculate">Рассчитать покупки</button>
<div id="result">
    <p>Откройте страницу истории покупок Gaijin и нажмите кнопку</p>
</div>
<script src="popup.js"></script>
</body>
</html>
