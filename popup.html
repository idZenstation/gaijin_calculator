<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Gaijin Purchase Summary</title>
    <style>
        body {
            width: 320px;
            padding: 0;
            margin: 0;
            font-family: Arial, sans-serif;
            background: #2d3a48;
            color: #bac2c8;
        }
        .container {
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e1ce9b;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 16px;
            padding: 12px;
            background: #27323f;
            border-radius: 8px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-popup-btn {
            background: #19bcb7;
            color: #2d3a48;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            padding: 6px 10px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .toggle-popup-btn:hover {
            background: #17a8a3;
            transform: translateY(-1px);
        }
        .toggle-popup-btn:active {
            transform: translateY(0);
        }
        .toggle-popup-btn.off {
            background: #dc3545;
        }
        .toggle-popup-btn.off:hover {
            background: #c82333;
        }
        .stats-section {
            background: #27323f;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #344150;
        }
        .stat-total {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #344150;
        }
        .total-amount {
            font-size: 24px;
            font-weight: bold;
            color: #19bcb7;
            margin: 8px 0;
        }
        .total-label {
            font-size: 12px;
            color: #8a949e;
            text-transform: uppercase;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
        }
        .stat-label {
            color: #bac2c8;
        }
        .stat-value {
            font-weight: bold;
        }
        .stat-value.total {
            color: #bac2c8;
        }
        .stat-value.free {
            color: #bac2c8;
        }
        .stat-value.paid {
            color: #19bcb7;
        }
        .refresh-btn {
            width: 100%;
            padding: 12px;
            background: #19bcb7;
            color: #2d3a48;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .refresh-btn:hover {
            background: #17a8a3;
            transform: translateY(-1px);
        }
        .refresh-btn:active {
            transform: translateY(0);
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #8a949e;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #344150;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-title">
            <span>🎯</span>
            <span>Статистика покупок</span>
        </div>
        <button class="toggle-popup-btn" id="togglePopupBtn" title="Показать/скрыть попап на странице">
            📊
        </button>
    </div>

    <div class="stats-section">
        <div class="stat-total">
            <div class="total-label">Общая сумма</div>
            <div class="total-amount" id="totalAmount">0 ₽</div>
        </div>

        <div class="stat-row">
            <span class="stat-label">Всего товаров:</span>
            <span class="stat-value total" id="totalItems">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Бесплатные:</span>
            <span class="stat-value free" id="freeItems">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Платные:</span>
            <span class="stat-value paid" id="paidItems">0</span>
        </div>
    </div>

    <button class="refresh-btn" id="refresh">🔄 Обновить статистику</button>

    <div class="footer">
        Gaijin Purchase Summary v1.0
    </div>
</div>

<script src="popup.js"></script>
</body>
</html>
