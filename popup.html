<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gaijin Calculator</title>
    <style>
        body {
            width: 200px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        button {
            width: 100%;
            padding: 8px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #45a049;
        }
        #status {
            margin-top: 10px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
<h3>Gaijin Calculator</h3>
<p>Откройте страницу покупок для автоматического расчёта</p>
<button id="calculate">Рассчитать вручную</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
