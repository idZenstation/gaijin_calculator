<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>War Thunder Purchase Analyzer</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
<div class="popup-container">
  <header>
    <img src="../icons/icon48.png" alt="Logo" class="logo">
    <h1>Purchase Analyzer</h1>
  </header>

  <div class="disclaimer">
    <p>⚠️ Unofficial extension. Not affiliated with Gaijin Entertainment.</p>
  </div>

  <div class="instructions">
    <h3>How to use:</h3>
    <ol>
      <li>Open <a href="https://store.gaijin.net/" target="_blank">War Thunder Store</a></li>
      <li>Go to your profile</li>
      <li>Stats will appear automatically</li>
    </ol>
  </div>

  <div class="actions">
    <button id="refresh-btn">Refresh Data</button>
    <a href="../privacy_policy.md" target="_blank" id="privacy-link">Privacy Policy</a>
  </div>
</div>
<script src="./popup.js"></script>
</body>
</html>
